  <!-- ==========================================
       Header / Navigation
       ========================================== -->
  <header class="header" role="banner">
    <div class="container header-inner">
      <!-- Logo -->
      <a href="{{ '/' | relative_url }}" class="logo" aria-label="Greenrise Energy Solutions - Home">
        <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="24" cy="24" r="22" fill="#1B4332"/>
          <path d="M24 10L27 20H37L29 26L32 36L24 30L16 36L19 26L11 20H21L24 10Z" fill="#C98A2B"/>
          <circle cx="24" cy="24" r="6" fill="#8A7B4A"/>
        </svg>
        <div class="logo-text">
          <span>Greenrise</span>
          <span>Energy Solutions</span>
        </div>
      </a>

      <!-- Desktop Navigation -->
      <nav class="nav" role="navigation" aria-label="Main navigation">
        <ul class="nav-menu">
          <li><a href="{{ '/' | relative_url }}" class="nav-link">Home</a></li>
          <li><a href="{{ '/#services' | relative_url }}" class="nav-link">Services</a></li>
          <li><a href="{{ '/#capabilities' | relative_url }}" class="nav-link">Capabilities</a></li>
          <li><a href="{{ '/#about' | relative_url }}" class="nav-link">About</a></li>
          <li><a href="{{ '/blog/' | relative_url }}" class="nav-link{% if include.active == 'blog' %} active{% endif %}">Blog</a></li>
          <li><a href="{{ '/#contact' | relative_url }}" class="nav-link">Contact</a></li>
        </ul>
        <a href="{{ '/#contact' | relative_url }}" class="btn btn-primary btn-sm nav-cta">Get Free Quote</a>
      </nav>

      <!-- Mobile Menu Toggle -->
      <button class="menu-toggle" aria-label="Toggle mobile menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <!-- Mobile Navigation -->
    <nav class="nav-mobile" role="navigation" aria-label="Mobile navigation">
      <ul class="nav-mobile-menu">
        <li><a href="{{ '/' | relative_url }}" class="nav-link">Home</a></li>
        <li><a href="{{ '/#services' | relative_url }}" class="nav-link">Services</a></li>
        <li><a href="{{ '/#capabilities' | relative_url }}" class="nav-link">Capabilities</a></li>
        <li><a href="{{ '/#about' | relative_url }}" class="nav-link">About</a></li>
        <li><a href="{{ '/blog/' | relative_url }}" class="nav-link{% if include.active == 'blog' %} active{% endif %}">Blog</a></li>
        <li><a href="{{ '/#contact' | relative_url }}" class="nav-link">Contact</a></li>
      </ul>
      <a href="{{ '/#contact' | relative_url }}" class="btn btn-primary">Get Free Quote</a>
    </nav>
  </header>

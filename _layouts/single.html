<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%231B4332'/%3E%3Cpath d='M50 20 L55 40 L75 40 L60 52 L65 72 L50 60 L35 72 L40 52 L25 40 L45 40 Z' fill='%23C98A2B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  <style>
    .post-wrap { padding: calc(var(--header-height) + var(--spacing-3xl)) var(--spacing-lg) var(--spacing-4xl); max-width: 720px; margin: 0 auto; }
    .post-wrap .back-link { display: inline-block; color: var(--color-primary); font-weight: 600; margin-bottom: var(--spacing-xl); text-decoration: none; }
    .post-wrap .back-link:hover { text-decoration: underline; }
    .post-wrap h1 { font-size: var(--font-size-2xl); margin-bottom: var(--spacing-sm); color: var(--color-gray-900); word-wrap: break-word; }
    .post-wrap .post-date { font-size: var(--font-size-sm); color: var(--color-gray-500); margin-bottom: var(--spacing-xl); }
    .post-wrap .post-body p { margin-bottom: var(--spacing-lg); color: var(--color-gray-700); line-height: 1.7; }
    .post-wrap .post-body h2 { font-size: var(--font-size-xl); margin: var(--spacing-2xl) 0 var(--spacing-md); color: var(--color-gray-900); }
    @media (max-width: 768px) {
      .post-wrap { padding: calc(var(--header-height) + var(--spacing-xl)) var(--spacing-md) var(--spacing-3xl); }
      .post-wrap h1 { font-size: var(--font-size-xl); }
    }
  </style>
</head>
<body>
  {% include header.html %}

  <main role="main">
    <article class="post-wrap">
      <a href="{{ '/blog/' | relative_url }}" class="back-link">← Back to Blog</a>
      <h1>{{ page.title }}</h1>
      <p class="post-date">{{ page.date | date: "%-d %b %Y" }}</p>
      <div class="post-body">
        {{ content }}
      </div>
    </article>
  </main>

  {% include footer.html %}
  <script src="{{ '/js/script.js' | relative_url }}"></script>
</body>
</html>
